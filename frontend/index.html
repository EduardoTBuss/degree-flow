<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Degree Flow — Planejador de Formatura</title>
    <script>
      // A1 (ADR-022): set data-theme before first paint to avoid a wrong-theme flash.
      // Mirrors lib/theme.ts (readStoredTheme + resolve) — keep the two in sync.
      (function () {
        var t = null;
        try { t = localStorage.getItem("fluxo.theme"); } catch (e) { /* storage blocked */ }
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
